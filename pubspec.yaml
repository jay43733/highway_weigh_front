name: highway_weight
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  http: ^1.3.0
  intl: ^0.20.2
  google_maps_flutter_web: ^0.5.12
  location: ^8.0.0
  geolocator: ^13.0.3
  google_maps_flutter: ^2.11.0
  lorem_ipsum: ^0.0.3
  number_pagination: ^1.1.6
  provider: ^6.1.4
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: IBMPlexSansThai
      fonts:
        - asset: fonts/IBMPlexSansThai-Thin.ttf
        - asset: fonts/IBMPlexSansThai-SemiBold.ttf
        - asset: fonts/IBMPlexSansThai-Regular.ttf
        - asset: fonts/IBMPlexSansThai-Medium.ttf
        - asset: fonts/IBMPlexSansThai-Light.ttf
        - asset: fonts/IBMPlexSansThai-ExtraLight.ttf
        - asset: fonts/IBMPlexSansThai-Bold.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
